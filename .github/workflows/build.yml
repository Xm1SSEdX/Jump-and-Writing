name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name ArtiixsBounce win_main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ArtiixsBounce-Windows
          path: dist/ArtiixsBounce.exe
